watch_stylesheet: true
watch_config: true
debug: false
bars:
  primary-bar:
    enabled: true
    style: "bar"
    screens: ['primary'] 
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: true
    blur_effect:
      enabled: false
      acrylic: true 
      dark_mode: true
      round_corners: true
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
      hide_on_fullscreen: true
    dimensions:
      width: "100%"
      height: 33
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    layouts:
      left:
        alignment: "left"
        stretch: true
      center:
        alignment: "center"
        stretch: false
      right:
        alignment: "right"
        stretch: true
    widgets:
      left: [
          "clock",
          "glazewm_workspaces",  
          "taskbar",
          "media",
      ]
      center: [
          "active_window",
        ]
      right: [
          "wallpapers",
          "systray",
          "wifi",
          # "volume",
          "audio-bluetooth-grouper",
          "battery",
          "notifications-grouper"
      ]

  secondary-bar:
    enabled: true
    screens: ['\\.\DISPLAY2','831W'] 
    class_name: "yasb-bar"
    alignment:
      position: "top"
      center: true
    blur_effect:
      enabled: false 
      acrylic: true 
      dark_mode: true
      round_corners: true
      border_color: None
    window_flags:
      always_on_top: false
      windows_app_bar: true
      hide_on_fullscreen: true
    dimensions:
      width: "100%"
      height: 33
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    layouts:
      left:
        alignment: "left"
        stretch: true
      center:
        alignment: "center"
        stretch: false
      right:
        alignment: "right"
        stretch: true
    widgets:
      left: [
          "cpu",
          "memory",
          "gpu",
          # "audio_visualizer",
      ]
      center: [
          "active_window",
        ]
      right: [
          "open_meteo",
          "notes",
          "glazewm_workspaces",  
          "clock24",
      ]

widgets:
  
  glazewm_workspaces:
    type: "glazewm.workspaces.GlazewmWorkspacesWidget"
    options:
      offline_label: "GlazeWM Offline"
      hide_empty_workspaces: true
      hide_if_offline: true

  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: " {info[percent][total]}%"
      update_interval: 2000
      progress_bar:
        enabled: true
        color: "#89b4fa"
      callbacks:
        on_left: "toggle_menu"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
    
  gpu:
    type: "yasb.gpu.GpuWidget"
    options:
      gpu_index: 1
      label: " {info[temp]}°C"
      label_alt: " {info[temp]}°C | {info[mem_used]} | {info[power_draw]}W | {info[utilization]}%"
      update_interval: 2000
      progress_bar:
        enabled: true
        color: "#a6e3a1"
      gpu_thresholds:
        low: 25
        medium: 50
        high: 90
      callbacks:
        on_left: "toggle_menu"
        on_right: "toggle_label"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
  
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      progress_bar:
        enabled: true
        color: "#cba6f7"
      label: " {virtual_mem_percent}% "
      label_alt: " {virtual_mem_outof}"
      update_interval: 10000
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec cmd /c Taskmgr"
        on_right: "toggle_label"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60

  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "[class_name='{win[class_name]}' exe='{win[process][name]}' hwnd={win[hwnd]}]"
      label_icon: true
      label_icon_size: 12
      max_length: 30
      max_length_ellipsis: "..."
      monitor_exclusive: true

  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>\uf017</span>{%I:%M %p}" #%I:%M %p #%H:%M - uses strf time
      label_alt: "<span>\uf017</span>{%A, %B %d. %Y %H:%M}"
      locale: "en_US"
      calendar:
        round_corners: true
        round_corners_type: "small"
        border_color: "#7aa2f7"
        alignment: "center"
        offset_top: 0
        show_holidays: true
        country_code: "NP"
        holiday_color: "#f38ba8"
  
  clock24: 
    type: "yasb.clock.ClockWidget"
    options:
      label: "<span>\uf017</span>{%H:%M %d/%m/%Y}" #%I:%M %p
      label_alt: "<span>\uf017</span>{%A, %B %d. %Y %H:%M}"
      locale: "en_US"
      calendar:
        round_corners: true
        round_corners_type: "small"
        border_color: "#7aa2f7"
        alignment: "center"
        offset_top: 0
        show_holidays: true
        country_code: "NP"
        holiday_color: "#f38ba8"

  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span> {wifi_name}"
      label_alt: "<span>{wifi_icon}</span> {wifi_name} {wifi_strength}%"
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span> {wifi_name}"
      ethernet_icon: "\uf108"
      update_interval: 5000
      callbacks:
        on_left: "toggle_menu"
        on_middle: "exec cmd.exe /c start ms-settings:network"
        on_right: "exec quick_settings"
      wifi_icons: [
        "\udb82\udd2e",  # Icon for 0% strength
        "\udb82\udd1f",  # Icon for 1-20% strength
        "\udb82\udd22",  # Icon for 21-40% strength
        "\udb82\udd25",  # Icon for 41-80% strength
        "\udb82\udd28"   # Icon for 81-100% strength
      ]

  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span> {level}"
      slider_beep: true
      volume_icons:
        - "\ueee8"  # Icon for muted
        - "\uf026"  # Icon for 0-10% volume
        - "\uf027"  # Icon for 11-30% volume
        - "\uf027"  # Icon for 31-60% volume
        - "\uf028"  # Icon for 61-100% volume
      audio_menu:
        show_apps: true
        show_apps_expanded: true
        blur: true
        round_corners: true
        round_corners_type: "small"
        border_color: "#7aa2f7"
        alignment: "center"
        direction: "down"
        offset_top: 0
      callbacks:
        on_right: "toggle_mute"
        on_middle: "exec quick_settings"

  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span>{percent}%"
      label_alt: "<span>{icon}</span> {percent}% | {power} | time: {time_remaining}"
      # hide_unsupported: true
      time_remaining_unlimited_icon: "Charging"
      charging_options:
        icon_format: "{charging_icon}" 
      status_thresholds:
        critical: 10
        low: 25
        medium: 75
        high: 95
        full: 100
      status_icons:
        icon_charging: "\uf0e7"
        icon_critical: "\uf244"
        icon_low: "\uf243"
        icon_medium: "\uf242"
        icon_high: "\uf241"
        icon_full: "\uf240"
      progress_bar:
        enabled: false
        progress_type: "circular"
        color: "#94e2d5"

  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "\uf011"
      uptime: True
      blur: false
      blur_background: true
      animation_duration: 150
      button_row: 5
      buttons:
        shutdown: ["\uf011", "Shut Down"]
        restart: ["\uead2", "Restart"]
        signout: ["\udb80\udf43", "Sign out"]
        hibernate: ["\uf28e", "Hibernate"]
        sleep: ["\u23fe", "Sleep"]
        cancel: ["", "Cancel"]

  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "\uf001 {title}"
      label_alt: "\uf001 {title} ● {artist}"
      hide_empty: true
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "toggle_play_pause"
        on_right: "open_media_source"
      max_field_size:
        label: 21
        label_alt: 45
      show_thumbnail: false
      controls_only: false
      controls_left: true
      controls_hide: true
      thumbnail_alpha: 100
      thumbnail_padding: 8
      thumbnail_corner_radius: 16
      icons:
        prev_track: "\uf04a "
        next_track: "\uf04e "
        play: "\uf04b "
        pause: "\uf04c "
      media_menu:
        show_volume_slider: true
        blur: false
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 120
        max_title_size: 60
        max_artist_size: 20
        show_source: true
      media_menu_icons:
        play: "\ue768"
        pause: "\ue769"
        prev_track: "\ue892"
        next_track: "\ue893"
      label_shadow:
        enabled: true
        color: "black"
        radius: 3
        offset: [ 1, 1 ]
      progress_bar:
        enabled: false
        alignment: "bottom"
  taskbar:
    type: "yasb.taskbar.TaskbarWidget"
    options:
      icon_size: 16
      tooltip: true
      show_only_visible: false
      strict_filtering: false
      monitor_exclusive: false
      hide_empty: true
      animation:
        enabled: true
      preview:
        enabled: true
        width: 240
        delay: 400
        padding: 8
        margin: 8
      title_label:
        enabled: false
        show: "focused"
        min_length: 10
        max_length: 20
      ignore_apps:
        processes: []
        titles: []
        classes: []
      grouping:
        enabled: true

  notifications:
    type: "yasb.notifications.NotificationsWidget"
    options:
      label: "{count}"
      label_alt: "{count} notifications"
      hide_empty: true
      tooltip: true
      callbacks:
        on_left: "toggle_notification"
        on_right: "do_nothing"
        on_middle: "toggle_label"
      label_shadow:
        enabled: true 
        color: "black"
        radius: 3
        offset: [ 1, 1 ]
  
  systray:
    type: "yasb.systray.SystrayWidget"
    options:
      class_name: "systray"
      label_collapsed: "󰇘"
      label_expanded: "󰇘"
      label_position: "left" # Can be "left" or "right"
      icon_size: 15 # Can be any integer between 8 and 64
      pin_click_modifier: "alt" # Can be "ctrl", "alt" or "shift"
      show_unpinned: false
      show_unpinned_button: true
      btn_shadow:
        enabled: true
        color: "black"
        radius: 3
        offset: [ 1, 1 ]
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: None
        alignment: "center"
        direction: "down"
        offset_top: 6
        offset_left: 0
        
  notes:
    type: "yasb.notes.NotesWidget"
    options:
      label: "<span>\udb82\udd0c</span>{count}"
      label_alt: "{count} notes"
      # data_path: "~/Documents/my-notes.json"  # Optional: custom JSON file path
      menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        # border_color: ""
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        max_title_size: 150
        show_date_time: true
      icons:
        note: "\udb82\udd0c"
        delete: "\ueab8"
        copy: "\uebcc"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      label_shadow:
        enabled: true
        color: "black"
        radius: 3
        offset: [ 1, 1 ]

  open_meteo:
    type: "yasb.open_meteo.OpenMeteoWidget"
    options:
      label: "<span>{icon}</span> {temp}"
      label_alt: "{location}: Min {min_temp}, Max {max_temp}, Humidity {humidity}"
      tooltip: true
      update_interval: 1800
      hide_decimal: true
      units: "metric"
      forecast_days: 7
      callbacks:
        on_left: "toggle_card"
        on_middle: "do_nothing"
        on_right: "toggle_label"
      icons:
        sunnyDay: "\ue30d"
        clearNight: "\ue32b"
        cloudyDay: "\ue312"
        cloudyNight: "\ue311"
        drizzleDay: "\udb81\ude7e"
        drizzleNight: "\udb81\ude7e"
        rainyDay: "\ue308"
        rainyNight: "\ue333"
        snowyDay: "\ue30a"
        snowyNight: "\ue335"
        foggyDay: "\ue303"
        foggyNight: "\ue346"
        thunderstormDay: "\ue30f"
        thunderstormNight: "\ue338"
        default: "\uebaa"
      weather_card:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        alignment: "right"
        direction: "down"
        icon_size: 64
        show_hourly_forecast: true
        time_format: "12h"
        hourly_point_spacing: 76
        hourly_icon_size: 32
        icon_smoothing: true
        temp_line_width: 2
        current_line_color: "#8EAEE8"
        current_line_width: 1
        current_line_style: "dot"
        hourly_gradient:
          enabled: false
          top_color: "#8EAEE8"
          bottom_color: "#2A3E68"
        hourly_forecast_buttons:
          enabled: true
          default_view: "temperature"
          temperature_icon: "\udb81\udd99"
          rain_icon: "\udb81\udd96"
          snow_icon: "\udb81\udd98"
        weather_animation:
          enabled: true
          snow_overrides_rain: true
          temp_line_animation_style: both
          rain_effect_intensity: 0.6
          snow_effect_intensity: 0.6
          scale_with_chance: true
  wallpapers:
    type: "yasb.wallpapers.WallpapersWidget"
    options:
      image_path: "C:\\Users\\ACER\\Pictures\\Wallpapers"
      change_automatically: true
      update_interval: 10800
      engine:
        enabled: false
        animation: "circle" # circle/slide_top/diamond/split
      gallery:
        type: "magnified" # default/magnified/strip/slide - see "Gallery types" below
        image_width: 220
        orientation: "portrait" # landscape/portrait
        image_corner_radius: 12
        accent_color: "#cba6f7"
      keybindings:
        - keys: "ctrl+alt+shift+w"
          action: "toggle_gallery"
          screen: "cursor"



  audio_visualizer:
    type: "yasb.audio_visualizer.AudioVisualizerWidget"
    options:
      style: bars
      height: 16
      smoothness: 80
      sensitivity: 50
      auto_gain: false
      framerate: 60
      freq_min: 500
      freq_max: 12000
      hide_idle: true
      hide_idle_after: 2000
      channels: mono
      mono_option: average
      reverse: false
      mirror: false
      bars:
        count: 9
        width: 6
        gap: 3
      waves:
        width: 80
      dots:
        count: 24
        size: 2
        gap: 4

  dnd:
    type: "yasb.dnd.DndWidget"
    options:
      label: "{icon}"
      default_active_mode: "priority"
      callbacks:
        on_left: "exec notification_center"
        on_right: "toggle_status"
        on_middle: "cycle_status"
      icons:
        disabled: "\uf0f3"
        priority: "\uf186" 
        alarms: "\uf1f6" 

  notifications-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "notifications-grouper"
      widgets: [
        "dnd",
        "notifications"
      ]


  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span>"
      class_name: ""
      label_no_device: ""
      label_device_separator: ", "
      max_length: 6
      max_length_ellipsis: "..."
      tooltip: true
      icons:
        bluetooth_on: ""
        bluetooth_off: ""
        bluetooth_connected: "\udb80\udcb1" 
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      menu_config:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        labels:
          title: "Bluetooth"
          your_devices: "Your devices"
          new_devices: "New devices"
          not_connected: "Not connected"
          connected: "Connected"
          more_settings: "More Bluetooth settings"
          connect: "Connect"
          disconnect: "Disconnect"
          connecting: "Connecting"
          disconnecting: "Disconnecting"
          pair: "Pair"
          manage: "Manage"
          power_on: "On"
          power_off: "Off"
        device_icons:
          headphones: "\ue7f6"
          headset: "\ue95b"
          speaker: "\ue7f5"
          phone: "\ue8ea"
          tablet: "\ue70a"
          laptop: "\ue7f8"
          computer: "\ue950"
          keyboard: "\ue765"
          mouse: "\ue962"
          controller: "\ue7fc"
          watch: "\ue918"
          camera: "\ue722"
          generic: "\ue702"
          battery:
            empty: "\ueba0"
            low: "\ueba2"
            medium: "\ueba5"
            high: "\ueba8"
            full: "\uebaa"
          scan: "\ue72c"

  audio-bluetooth-grouper:
    type: "yasb.grouper.GrouperWidget"
    options:
      class_name: "audio-bluetooth-grouper"
      widgets: [
        "bluetooth",
        "volume",
      ]

